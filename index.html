<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Grazie — entre proches</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="%23EDE3D1"/><rect x="12" y="16" width="40" height="32" rx="3" fill="%23A9763F"/><rect x="28" y="16" width="8" height="32" fill="%232F4858"/><rect x="12" y="29" width="40" height="6" fill="%232F4858"/><path d="M32 16c-4-6-12-5-12 0" stroke="%232F4858" stroke-width="3" fill="none"/><path d="M32 16c4-6 12-5 12 0" stroke="%232F4858" stroke-width="3" fill="none"/></svg>'>
<style>
  :root{
    --papier:#EDE3D1;
    --carte:#F7F0E2;
    --encre:#231F1C;
    --terre:#A9763F;
    --bleu:#2F4858;
    --trait:#D6C7AC;
    --doux:#E4D7BE;
    --gris:#6E6252;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{max-width:100%;overflow-x:hidden}
  body{
    background:var(--papier);
    color:var(--encre);
    font-family:"Atkinson Hyperlegible",Georgia,"Iowan Old Style",serif;
    font-size:17px;
    line-height:1.55;
    padding:24px 16px 64px;
    -webkit-text-size-adjust:100%;
  }
  .page{max-width:620px;margin:0 auto}
  h1{
    font-family:Fraunces,"Iowan Old Style",Georgia,serif;
    font-size:2.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.05;
  }
  h2{font-family:Fraunces,"Iowan Old Style",Georgia,serif;font-size:1.35rem;font-weight:600;margin-bottom:10px}
  p{margin-bottom:12px}
  ol{margin:0 0 12px 22px}
  ol li{margin-bottom:7px;padding-left:3px}
  ol li::marker{font-weight:700;color:var(--terre)}
  .sous{color:var(--gris);font-style:italic;margin:4px 0 22px}
  .entete{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .entete a{color:var(--terre);font-weight:700;text-decoration:none;font-size:.95rem;margin-top:10px;white-space:nowrap}
  .bloc{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:18px;margin-bottom:18px}
  label{display:block;font-size:.85rem;font-weight:700;margin-bottom:6px;letter-spacing:.02em}
  input[type=text],textarea{
    width:100%;font:inherit;font-size:16px;color:var(--encre);
    background:var(--papier);border:1.5px solid var(--trait);border-radius:9px;
    padding:11px 12px;margin-bottom:14px;-webkit-appearance:none;
  }
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--bleu);outline-offset:1px;border-color:var(--bleu)}
  .rangee{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .choix{
    font:inherit;font-size:.9rem;background:var(--papier);color:var(--encre);
    border:1.5px solid var(--trait);border-radius:999px;padding:8px 14px;cursor:pointer;
  }
  .choix[aria-pressed=true]{background:var(--encre);color:var(--papier);border-color:var(--encre)}
  .choix:focus-visible,.btn:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
  .btn{
    display:block;width:100%;font:inherit;font-weight:700;background:var(--bleu);color:var(--carte);
    border:none;border-radius:11px;padding:14px;margin-bottom:10px;cursor:pointer;text-align:center;
  }
  .btn.terre{background:var(--terre)}
  .btn.calme{background:transparent;color:var(--encre);border:1.5px solid var(--trait)}
  .btn.petit{display:inline-block;width:auto;padding:9px 16px;font-size:.92rem;margin:4px 6px 0 0}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .duo .btn{margin:0;padding:16px 10px;font-size:1.05rem}
  .annonce{
    background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--terre);
    border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:14px;
  }
  .annonce.demande{border-left-color:var(--bleu)}
  .annonce.prise{opacity:.72}
  .annonce .titre{font-family:Fraunces,Georgia,serif;font-size:1.15rem;font-weight:600;line-height:1.3;margin:6px 0 2px}
  .annonce .mot{font-style:italic;color:var(--gris);margin:4px 0 0}
  .annonce .qui{font-size:.85rem;color:var(--gris);margin-top:6px}
  .annonce .etat{margin-top:12px;padding-top:10px;border-top:1px dashed var(--trait);font-size:.95rem}
  .annonce .etat p{margin-bottom:6px}
  .etiq{
    display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--terre);color:var(--terre);border-radius:999px;padding:1px 9px;margin-right:6px;
  }
  .demande .etiq.sens{border-color:var(--bleu);color:var(--bleu)}
  .etiq.cat{border-color:var(--trait);color:var(--gris)}
  .rgpd{background:var(--doux);border-left:3px solid var(--bleu);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:16px;font-size:.92rem}
  .rgpd strong{display:block;font-size:1rem}
  .cle{font-family:ui-monospace,Menlo,monospace;font-size:.95rem;word-break:break-all;background:var(--doux);border-radius:9px;padding:12px;margin-bottom:12px}
  .compte{font-size:.85rem;color:var(--gris);margin:-6px 0 12px}
  .vide{color:var(--gris);font-style:italic;margin:6px 0 18px}
  details{margin-bottom:18px}
  summary{cursor:pointer;font-weight:700;color:var(--bleu);margin-bottom:8px}
  .pied{font-size:.8rem;color:var(--gris);text-align:center;margin-top:28px}
  .pied a{color:var(--gris)}
  #langues{justify-content:flex-end;gap:5px;margin-bottom:6px}
  #langues .choix{font-size:.75rem;padding:5px 11px}
  #message{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100% - 32px);
    background:var(--encre);color:var(--papier);padding:11px 18px;border-radius:12px;font-size:.95rem;z-index:5;
  }
  @media (prefers-reduced-motion:no-preference){#app.entree>*{animation:entree .18s ease-out}}
  @keyframes entree{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="page">
  <div id="langues" class="rangee"></div>
  <div id="app"><p class="vide">Un instant…</p></div>
</div>
<div id="message" role="status" hidden></div>

<script>
(() => {
  'use strict';

  /* ================= Réglages ================= */
  const API = 'https://azertida.alwaysdata.net/grazie/api.php';
  const VERSION = '2.0';
  const P = 'grazie2.';            // préfixe du stockage local (distinct de la v1, qui utilise « grazie. »)
  const NB = ' ';             // espace fine insécable avant ? ! : ;
  const MAX_TITRE = 60, MAX_MOT = 140, MAX_PRENOM = 20;
  const CATEGORIES = [['l', 'Livres'], ['v', 'Vêtements'], ['o', 'Autre']];

  /* ================= Langues ================= */
  const LANGUES_UI = [['fr', 'FR'], ['en', 'EN']];
  const TRAD = {};
  TRAD.en = {
    'Grazie — entre proches': 'Grazie — among friends and family',
    'Un instant…': 'One moment…',
    'Entre proches': 'Among friends and family',
    'Ce qui a compté, remis à quelqu’un de proche.': 'Things that mattered, passed on to someone close.',
    'Pour entrer, il te faut le lien de ton cercle': 'To get in, you need your circle’s link',
    'Un proche te l’envoie. Ouvre-le, ou colle-le ici.': 'Someone close sends it to you. Open it, or paste it here.',
    'Le lien du cercle': 'The circle link',
    'Entrer': 'Enter',
    'Ce lien n’est pas un lien Grazie.': 'This isn’t a Grazie link.',
    'Créer un cercle': 'Create a circle',
    'Nom du cercle': 'Circle name',
    'La famille, les voisins…': 'Family, neighbours…',
    'Clé de gestion d’un cercle existant': 'Management key of an existing circle',
    'Seulement si un cercle existe déjà sur ce serveur.': 'Only if a circle already exists on this server.',
    'La création d’un nouveau cercle demande la clé d’un cercle existant.': 'Creating a new circle needs the key of an existing one.',
    'Ta clé de gestion': 'Your management key',
    'Elle te permet de renommer le cercle et de clore n’importe quelle annonce. Elle n’est montrée qu’une fois : garde-la en lieu sûr.': 'It lets you rename the circle and close any listing. It is shown only once: keep it somewhere safe.',
    'Copier la clé': 'Copy the key',
    'Le lien du cercle, à envoyer à tes proches': 'The circle link, to send to your people',
    'Continuer': 'Continue',
    'Ton prénom': 'Your first name',
    'Il apparaît sur tes annonces et tes réponses. Le prénom suffit.': 'It appears on your listings and replies. A first name is enough.',
    'Entrer dans le cercle': 'Enter the circle',
    'Bienvenue dans le cercle': 'Welcome to the circle',
    'Réglages': 'Settings',
    'Ton cercle': 'Your circle',
    'Je donne': 'I’m giving',
    'Je cherche': 'I’m looking',
    'Tout': 'All',
    'Dons': 'Gifts',
    'Demandes': 'Requests',
    'Rien pour l’instant. Propose quelque chose, ou dis ce que tu cherches.': 'Nothing yet. Offer something, or say what you’re looking for.',
    'Rien dans cette catégorie pour l’instant.': 'Nothing here yet.',
    'Comment ça marche': 'How it works',
    'Ouvre le lien du cercle et garde-le : c’est toujours le même.': 'Open the circle link and keep it: it never changes.',
    'Propose ce que tu donnes, ou dis ce que tu cherches.': 'Offer what you’re giving, or say what you’re looking for.',
    'Touche « Je le prends » ou « J’en ai un ». La personne le voit, et vous vous arrangez entre vous.': 'Tap “I’ll take it” or “I have one”. The other person sees it, and you sort it out between you.',
    'Livres': 'Books',
    'Vêtements': 'Clothes',
    'Autre': 'Other',
    'Don': 'Gift',
    'Demande': 'Request',
    'aujourd’hui': 'today',
    'hier': 'yesterday',
    'il y a {0} jours': '{0} days ago',
    '{0}, {1}': '{0}, {1}',
    'Je le prends': 'I’ll take it',
    'J’en ai un': 'I have one',
    'Personne n’a encore répondu.': 'No one has replied yet.',
    'Retirer l’annonce': 'Remove the listing',
    '{0} le prend. Arrangez-vous entre vous.': '{0} is taking it. Sort it out between you.',
    '{0} en a un. Arrangez-vous entre vous.': '{0} has one. Sort it out between you.',
    'C’est fait, clore l’annonce': 'Done, close the listing',
    'Remettre disponible': 'Make it available again',
    'Tu le prends. Arrange-toi avec {0}.': 'You’re taking it. Sort it out with {0}.',
    'Tu en as un. Arrange-toi avec {0}.': 'You have one. Sort it out with {0}.',
    'Je me désiste': 'I’m pulling out',
    'Pris par {0}': 'Taken by {0}',
    '{0} en a un': '{0} has one',
    'Clore cette annonce ? Elle sera effacée pour tout le cercle.': 'Close this listing? It will be erased for the whole circle.',
    'Retirer cette annonce ? Elle sera effacée pour tout le cercle.': 'Remove this listing? It will be erased for the whole circle.',
    'Annonce close.': 'Listing closed.',
    'C’est noté.': 'Noted.',
    'Ce que tu donnes': 'What you’re giving',
    'Ce que tu cherches': 'What you’re looking for',
    'Sorte': 'Kind',
    'En quelques mots': 'In a few words',
    'Trois romans italiens': 'Three Italian novels',
    'Manteau d’hiver, taille M': 'Winter coat, size M',
    'Une perceuse pour un week-end': 'A drill for a weekend',
    'Une précision (facultatif)': 'A detail (optional)',
    'État, taille, pour qui, jusqu’à quand…': 'Condition, size, for whom, until when…',
    '{0} caractères restants.': '{0} characters left.',
    'Visible par tout le cercle. Effacée quand tu la clos, ou d’elle-même au bout de {0} jours.': 'Visible to the whole circle. Erased when you close it, or on its own after {0} days.',
    'Publier': 'Publish',
    'Annuler': 'Cancel',
    'Il manque quelques mots pour dire ce que c’est.': 'A few words are missing to say what it is.',
    'Publié.': 'Published.',
    'Retour au cercle': 'Back to the circle',
    'Le prénom suffit.': 'A first name is enough.',
    'Enregistrer': 'Save',
    'Prénom enregistré. Il s’applique à tes prochaines annonces et réponses.': 'First name saved. It applies to your next listings and replies.',
    'Inviter': 'Invite',
    'Envoie ce lien à tes proches. Qui l’a peut voir et publier dans le cercle : ne le mets pas en ligne.': 'Send this link to your people. Anyone who has it can see and post in the circle: don’t put it online.',
    'Envoyer le lien': 'Send the link',
    'Copier le lien': 'Copy the link',
    'Copié.': 'Copied.',
    'Copie impossible : sélectionne le texte.': 'Copying failed: select the text.',
    'Ce que Grazie garde': 'What Grazie keeps',
    'Sur ce téléphone': 'On this phone',
    'le code du cercle, ton prénom, et les jetons qui prouvent que tes annonces et tes réponses sont les tiennes.': 'the circle code, your first name, and the tokens proving your listings and replies are yours.',
    'Sur le serveur (alwaysdata, en France)': 'On the server (alwaysdata, in France)',
    'le nom du cercle et, pour chaque annonce : ce qu’elle dit, un prénom, sa date, et le prénom de qui a répondu. Rien d’autre : ni téléphone, ni adresse, ni photo.': 'the circle name and, for each listing: what it says, a first name, its date, and the first name of whoever replied. Nothing else: no phone, no address, no photo.',
    'Combien de temps': 'How long',
    'une annonce close est effacée tout de suite ; une annonce oubliée s’efface d’elle-même au bout de {0} jours.': 'a closed listing is erased at once; a forgotten one erases itself after {0} days.',
    'Gestion du cercle': 'Managing the circle',
    'Tu gères ce cercle sur cet appareil.': 'You manage this circle on this device.',
    'Renommer': 'Rename',
    'Je gère ce cercle': 'I manage this circle',
    'Ta clé de gestion, si tu l’as.': 'Your management key, if you have it.',
    'Utiliser cette clé': 'Use this key',
    'Cette clé ne correspond pas à ce cercle.': 'This key doesn’t match this circle.',
    'Clé reconnue.': 'Key recognised.',
    'Tout effacer de ce téléphone': 'Erase everything from this phone',
    'Clôt tes annonces, retire tes réponses, puis efface tout ce que Grazie garde ici. Pour revenir, il te faudra le lien du cercle.': 'Closes your listings, withdraws your replies, then erases everything Grazie keeps here. To come back, you’ll need the circle link.',
    'Tout effacer ? Tes annonces seront closes et tes réponses retirées.': 'Erase everything? Your listings will be closed and your replies withdrawn.',
    'C’est effacé.': 'All erased.',
    'Première version, tout dans le lien': 'First version, everything in the link',
    'Ce cercle n’existe plus.': 'This circle no longer exists.',
    'Cette annonce n’existe plus.': 'This listing no longer exists.',
    'Quelqu’un a répondu juste avant toi.': 'Someone replied just before you.',
    'Pas de connexion pour l’instant : réessaie dans un moment.': 'No connection right now: try again in a moment.',
    'Erreur du serveur': 'Server error',
    'Rejoindre ce cercle à la place du tien ?': 'Join this circle instead of yours?',
    'Actualiser': 'Refresh'
  };

  const lireBrut = (k, def) => { try { const v = localStorage.getItem(P + k); return v === null ? def : JSON.parse(v); } catch { return def; } };
  function choisirLangue() {
    const voulue = lireBrut('langue', null);
    const connues = LANGUES_UI.map((p) => p[0]);
    if (voulue && connues.includes(voulue)) return voulue;
    for (const l of (navigator.languages || [navigator.language || 'fr'])) {
      const code = String(l).slice(0, 2).toLowerCase();
      if (connues.includes(code)) return code;
    }
    return 'fr';
  }
  const langue = choisirLangue();
  const DP = langue === 'fr' ? `${NB}:` : ':';   // deux-points selon la langue
  // En français, espace fine insécable avant ? ! : ; et à l'intérieur des guillemets.
  const typo = (t) => t.replace(/ ([?!:;»])/g, '\u202f$1').replace(/« /g, '«\u202f');
  const L = (s) => { if (langue === 'fr') return typo(s); const d = TRAD[langue]; const v = d && d[s]; return v === undefined ? s : v; };
  const Lf = (s, ...a) => L(s).replace(/\{(\d)\}/g, (_, i) => a[i]);
  const LN = L;

  /* ================= Stockage local ================= */
  const lire = lireBrut;
  const ecrire = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };
  const oublier = (k) => { try { localStorage.removeItem(P + k); } catch {} };

  let cercle = lire('cercle', null);       // { c, nom, admin? }
  let prenom = lire('prenom', '');
  let miennes = lire('miennes', {});       // { idAnnonce: jeton } — annonces que j'ai publiées
  let reponses = lire('reponses', {});     // { idAnnonce: jeton } — annonces auxquelles j'ai répondu
  let donnees = null;                      // réponse du serveur
  let ecran = 'cercle';
  let filtre = 'tout';
  let brouillon = null;                    // annonce en cours de rédaction

  /* ================= Outils ================= */
  const $app = document.getElementById('app');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const versDate = (s) => { const [a, m, j] = s.split('-').map(Number); return new Date(a, m - 1, j); };

  function quand(dateIso) {
    const n = Math.round((versDate(iso(new Date())) - versDate(dateIso)) / 864e5);
    if (n <= 0) return L('aujourd’hui');
    if (n === 1) return L('hier');
    return Lf('il y a {0} jours', n);
  }

  let minuterie;
  function dire(texte) {
    const m = $('message');
    m.textContent = texte; m.hidden = false;
    clearTimeout(minuterie); minuterie = setTimeout(() => { m.hidden = true; }, 3500);
  }

  async function api(action, corps = null, params = {}) {
    let rep;
    try {
      if (corps) {
        rep = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                 body: JSON.stringify({ action, c: cercle?.c, ...corps }) });
      } else {
        const q = new URLSearchParams({ action, c: cercle?.c || '', ...params });
        rep = await fetch(`${API}?${q}`);
      }
    } catch {
      throw new Error(LN('Pas de connexion pour l’instant : réessaie dans un moment.'));
    }
    const json = await rep.json().catch(() => ({}));
    if (!rep.ok) {
      const msg = { 'Cette annonce n\'existe plus': 'Cette annonce n’existe plus.',
                    'Quelqu\'un a répondu juste avant toi': 'Quelqu’un a répondu juste avant toi.' }[json.erreur];
      const e = new Error(L(msg || json.erreur || 'Erreur du serveur'));
      e.statut = rep.status; e.brut = json.erreur || '';
      throw e;
    }
    return json;
  }

  const lienCercle = () => `${location.origin}${location.pathname}#c=${cercle.c}`;
  function lireLien(texte) {
    const m = String(texte).match(/[#&]c=([0-9a-f]{18})/);
    return m ? m[1] : null;
  }

  async function copier(texte) {
    try { await navigator.clipboard.writeText(texte); dire(L('Copié.')); }
    catch { dire(LN('Copie impossible : sélectionne le texte.')); }
  }
  async function partager(texte) {
    if (navigator.share) {
      try { await navigator.share({ title: 'Grazie', text: cercle?.nom ? `Grazie — ${cercle.nom}` : 'Grazie', url: texte }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    copier(texte);
  }

  function boutonsLangue() {
    const z = $('langues');
    z.innerHTML = LANGUES_UI.map(([code, nom]) =>
      `<button type="button" class="choix" data-langue="${code}" aria-pressed="${code === langue}">${nom}</button>`).join('');
    z.querySelectorAll('[data-langue]').forEach((b) => {
      b.onclick = () => { if (b.dataset.langue === langue) return; ecrire('langue', b.dataset.langue); location.reload(); };
    });
    document.documentElement.lang = langue;
    document.title = L('Grazie — entre proches');
  }

  /* ================= Données ================= */
  async function charger() {
    const params = cercle.admin ? { admin: cercle.admin } : {};
    donnees = await api('liste', null, params);
    if (donnees.nom !== cercle.nom) { cercle.nom = donnees.nom; ecrire('cercle', cercle); }
    // Ménage local : annonces disparues, réponses libérées par l'auteur.
    const ids = new Set(donnees.annonces.map((a) => a.id));
    let change = false;
    for (const id of Object.keys(miennes)) if (!ids.has(id)) { delete miennes[id]; change = true; }
    for (const id of Object.keys(reponses)) {
      const a = donnees.annonces.find((x) => x.id === id);
      if (!a || !a.rep_prenom) { delete reponses[id]; change = true; }
    }
    if (change) { ecrire('miennes', miennes); ecrire('reponses', reponses); }
  }

  async function rafraichir() {
    if (cercle && prenom) {
      try { await charger(); }
      catch (err) {
        if (err.statut === 404 && /Cercle/.test(err.brut)) {
          dire(L('Ce cercle n’existe plus.'));
          oublier('cercle'); cercle = null; miennes = {}; reponses = {};
          ecrire('miennes', miennes); ecrire('reponses', reponses);
        } else dire(err.message);
      }
    }
    afficher();
  }

  async function agir(bouton, travail) {
    if (bouton) bouton.disabled = true;
    try { await travail(); }
    catch (err) { dire(err.message); }
    await rafraichir();
  }

  /* ================= Écrans ================= */
  let dernierEcran = null;
  function afficher() {
    boutonsLangue();
    // Petite animation seulement quand on change d'écran, pas à chaque actualisation.
    const nom = !cercle ? 'accueil' : ecran === 'cle' ? 'cle' : !prenom ? 'prenom' : ecran;
    $app.classList.toggle('entree', nom !== dernierEcran);
    dernierEcran = nom;
    if (!cercle) return ecranAccueil();
    if (ecran === 'cle') return ecranCle();
    if (!prenom) return ecranPrenom();
    if (ecran === 'annonce') return ecranAnnonce();
    if (ecran === 'reglages') return ecranReglages();
    return ecranCercle();
  }

  /* ----- Pas encore de cercle ----- */
  function ecranAccueil() {
    $app.innerHTML = `
      <h1>Grazie</h1>
      <p class="sous">${esc(L('Ce qui a compté, remis à quelqu’un de proche.'))}</p>
      <div class="bloc">
        <h2>${esc(L('Pour entrer, il te faut le lien de ton cercle'))}</h2>
        <p>${esc(L('Un proche te l’envoie. Ouvre-le, ou colle-le ici.'))}</p>
        <label for="lienColle">${esc(L('Le lien du cercle'))}</label>
        <input type="text" id="lienColle" autocomplete="off" inputmode="url">
        <button class="btn" id="entrer">${esc(L('Entrer'))}</button>
      </div>
      <details>
        <summary>${esc(L('Créer un cercle'))}</summary>
        <div class="bloc">
          <label for="nomCercle">${esc(L('Nom du cercle'))}</label>
          <input type="text" id="nomCercle" maxlength="40" placeholder="${esc(L('La famille, les voisins…'))}">
          <label for="cleExistante">${esc(L('Clé de gestion d’un cercle existant'))}</label>
          <input type="text" id="cleExistante" autocomplete="off">
          <p class="compte">${esc(L('Seulement si un cercle existe déjà sur ce serveur.'))}</p>
          <button class="btn calme" id="creer">${esc(L('Créer un cercle'))}</button>
        </div>
      </details>
      ${pied()}`;
    $('entrer').onclick = async () => {
      const c = lireLien($('lienColle').value);
      if (!c) return dire(L('Ce lien n’est pas un lien Grazie.'));
      rejoindre(c);
      await rafraichir();
    };
    $('creer').onclick = (e) => agirCreation(e.target);
  }

  async function agirCreation(bouton) {
    bouton.disabled = true;
    try {
      const nom = $('nomCercle').value.trim();
      const cle = $('cleExistante').value.trim();
      const r = await api('creer_cercle', { nom, cle_existante: cle });
      cercle = { c: r.c, admin: r.admin, nom };
      ecrire('cercle', cercle);
      ecran = 'cle';
      afficher();
    } catch (err) {
      dire(err.statut === 403 ? L('La création d’un nouveau cercle demande la clé d’un cercle existant.') : err.message);
      bouton.disabled = false;
    }
  }

  function rejoindre(c) {
    if (cercle && cercle.c === c) return;
    if (cercle && !confirm(LN('Rejoindre ce cercle à la place du tien ?'))) return;
    cercle = { c, nom: '' };
    miennes = {}; reponses = {};
    ecrire('cercle', cercle); ecrire('miennes', miennes); ecrire('reponses', reponses);
    ecran = 'cercle';
  }

  /* ----- Clé de gestion, montrée une fois ----- */
  function ecranCle() {
    $app.innerHTML = `
      <h1>Grazie</h1>
      <p class="sous">${esc(cercle.nom || L('Ton cercle'))}</p>
      <div class="bloc">
        <h2>${esc(L('Ta clé de gestion'))}</h2>
        <p>${esc(LN('Elle te permet de renommer le cercle et de clore n’importe quelle annonce. Elle n’est montrée qu’une fois : garde-la en lieu sûr.'))}</p>
        <div class="cle">${esc(cercle.admin)}</div>
        <button class="btn calme" id="copierCle">${esc(L('Copier la clé'))}</button>
      </div>
      <div class="bloc">
        <h2>${esc(L('Le lien du cercle, à envoyer à tes proches'))}</h2>
        <div class="cle">${esc(lienCercle())}</div>
        <button class="btn calme" id="envoyerLien">${esc(L('Envoyer le lien'))}</button>
      </div>
      <button class="btn" id="continuer">${esc(L('Continuer'))}</button>`;
    $('copierCle').onclick = () => copier(cercle.admin);
    $('envoyerLien').onclick = () => partager(lienCercle());
    $('continuer').onclick = () => { ecran = 'cercle'; rafraichir(); };
  }

  /* ----- Première fois : le prénom ----- */
  function ecranPrenom() {
    $app.innerHTML = `
      <h1>Grazie</h1>
      <p class="sous">${esc(cercle.nom || L('Entre proches'))}</p>
      <div class="bloc">
        <label for="prenom">${esc(L('Ton prénom'))}</label>
        <input type="text" id="prenom" maxlength="${MAX_PRENOM}" autocomplete="given-name">
        <p class="compte">${esc(L('Il apparaît sur tes annonces et tes réponses. Le prénom suffit.'))}</p>
        <button class="btn" id="valider" disabled>${esc(L('Entrer dans le cercle'))}</button>
      </div>
      ${modeEmploi(true)}`;
    const champ = $('prenom'), bouton = $('valider');
    champ.oninput = () => { bouton.disabled = !champ.value.trim(); };
    bouton.onclick = async () => {
      prenom = champ.value.trim().slice(0, MAX_PRENOM);
      ecrire('prenom', prenom);
      dire(L('Bienvenue dans le cercle'));
      await rafraichir();
    };
    champ.focus();
  }

  function modeEmploi(ouvert) {
    return `
      <details${ouvert ? ' open' : ''}>
        <summary>${esc(L('Comment ça marche'))}</summary>
        <div class="bloc"><ol>
          <li>${esc(LN('Ouvre le lien du cercle et garde-le : c’est toujours le même.'))}</li>
          <li>${esc(L('Propose ce que tu donnes, ou dis ce que tu cherches.'))}</li>
          <li>${esc(L('Touche « Je le prends » ou « J’en ai un ». La personne le voit, et vous vous arrangez entre vous.'))}</li>
        </ol></div>
      </details>`;
  }

  function pied() {
    return `<p class="pied">Grazie · version ${VERSION} · <a href="v1/">${esc(L('Première version, tout dans le lien'))}</a></p>`;
  }

  /* ----- Le cercle : la liste des annonces ----- */
  function ecranCercle() {
    const toutes = donnees?.annonces || [];
    const visibles = toutes.filter((a) => filtre === 'tout' || (filtre === 'dons' ? a.sens === 'don' : a.sens === 'demande'));
    const filtres = [['tout', 'Tout'], ['dons', 'Dons'], ['demandes', 'Demandes']];
    $app.innerHTML = `
      <div class="entete">
        <div><h1>Grazie</h1><p class="sous">${esc(cercle.nom || L('Ton cercle'))}</p></div>
        <a href="#" id="versReglages">${esc(L('Réglages'))}</a>
      </div>
      <div class="duo">
        <button class="btn terre" data-nouveau="don">${esc(L('Je donne'))}</button>
        <button class="btn" data-nouveau="demande">${esc(L('Je cherche'))}</button>
      </div>
      ${toutes.length ? `<div class="rangee">${filtres.map(([k, t]) =>
        `<button type="button" class="choix" data-filtre="${k}" aria-pressed="${filtre === k}">${esc(L(t))}</button>`).join('')}</div>` : ''}
      ${!toutes.length ? `<p class="vide">${esc(L('Rien pour l’instant. Propose quelque chose, ou dis ce que tu cherches.'))}</p>`
        : !visibles.length ? `<p class="vide">${esc(L('Rien dans cette catégorie pour l’instant.'))}</p>`
        : visibles.map(carteAnnonce).join('')}
      <button class="btn calme" id="actualiser">${esc(L('Actualiser'))}</button>
      ${modeEmploi(!toutes.length)}
      ${pied()}`;

    $('versReglages').onclick = (e) => { e.preventDefault(); ecran = 'reglages'; afficher(); window.scrollTo(0, 0); };
    $app.querySelectorAll('[data-nouveau]').forEach((b) => {
      b.onclick = () => {
        brouillon = { sens: b.dataset.nouveau, categorie: 'o', titre: '', mot: '' };
        ecran = 'annonce'; afficher(); window.scrollTo(0, 0);
      };
    });
    $app.querySelectorAll('[data-filtre]').forEach((b) => { b.onclick = () => { filtre = b.dataset.filtre; afficher(); }; });
    $('actualiser').onclick = (e) => agir(e.target, async () => {});
    $app.querySelectorAll('[data-action]').forEach((b) => { b.onclick = () => action(b); });
  }

  function carteAnnonce(a) {
    const don = a.sens === 'don';
    const cat = CATEGORIES.find((c) => c[0] === a.categorie);
    const mienne = !!miennes[a.id];
    const ma_reponse = !!reponses[a.id];
    const prise = !!a.rep_prenom;
    let etat = '';
    if (mienne && cercle) {
      if (prise) {
        etat = `<p>${esc(Lf(don ? '{0} le prend. Arrangez-vous entre vous.' : '{0} en a un. Arrangez-vous entre vous.', a.rep_prenom))}</p>
          <button class="btn petit" data-action="clore" data-id="${a.id}">${esc(L('C’est fait, clore l’annonce'))}</button>
          <button class="btn petit calme" data-action="liberer" data-id="${a.id}">${esc(L('Remettre disponible'))}</button>`;
      } else {
        etat = `<p class="qui">${esc(L('Personne n’a encore répondu.'))}</p>
          <button class="btn petit calme" data-action="retirer" data-id="${a.id}">${esc(L('Retirer l’annonce'))}</button>`;
      }
    } else if (ma_reponse && prise) {
      etat = `<p>${esc(Lf(don ? 'Tu le prends. Arrange-toi avec {0}.' : 'Tu en as un. Arrange-toi avec {0}.', a.prenom))}</p>
        <button class="btn petit calme" data-action="desister" data-id="${a.id}">${esc(L('Je me désiste'))}</button>`;
    } else if (prise) {
      etat = `<p class="qui">${esc(Lf(don ? 'Pris par {0}' : '{0} en a un', a.rep_prenom))}</p>`;
    } else {
      etat = `<button class="btn petit${don ? ' terre' : ''}" data-action="prendre" data-id="${a.id}">${esc(L(don ? 'Je le prends' : 'J’en ai un'))}</button>`;
    }
    const gestion = cercle?.admin && !mienne
      ? `<button class="btn petit calme" data-action="moderer" data-id="${a.id}">${esc(L('Retirer l’annonce'))}</button>` : '';
    return `
      <article class="annonce ${don ? 'don' : 'demande'}${prise && !mienne && !ma_reponse ? ' prise' : ''}">
        <span class="etiq sens">${esc(L(don ? 'Don' : 'Demande'))}</span><span class="etiq cat">${esc(L(cat ? cat[1] : 'Autre'))}</span>
        <div class="titre">${esc(a.titre)}</div>
        ${a.mot ? `<p class="mot">${esc(a.mot)}</p>` : ''}
        <p class="qui">${esc(Lf('{0}, {1}', a.prenom, quand(a.cree)))}</p>
        <div class="etat">${etat}${gestion}</div>
      </article>`;
  }

  function action(b) {
    const id = b.dataset.id;
    switch (b.dataset.action) {
      case 'prendre':
        return agir(b, async () => {
          const r = await api('prendre', { id, prenom, jeton_auteur: miennes[id] || '' });
          reponses[id] = r.jeton; ecrire('reponses', reponses);
          dire(L('C’est noté.'));
        });
      case 'desister':
        return agir(b, async () => {
          await api('liberer', { id, jeton: reponses[id] });
          delete reponses[id]; ecrire('reponses', reponses);
        });
      case 'liberer':
        return agir(b, () => api('liberer', { id, jeton: miennes[id] }));
      case 'clore':
      case 'retirer':
        if (!confirm(LN(b.dataset.action === 'clore' ? 'Clore cette annonce ? Elle sera effacée pour tout le cercle.'
                                                      : 'Retirer cette annonce ? Elle sera effacée pour tout le cercle.'))) return;
        return agir(b, async () => {
          await api('clore', { id, jeton: miennes[id] });
          delete miennes[id]; ecrire('miennes', miennes);
          dire(L('Annonce close.'));
        });
      case 'moderer':
        if (!confirm(LN('Retirer cette annonce ? Elle sera effacée pour tout le cercle.'))) return;
        return agir(b, () => api('clore', { id, admin: cercle.admin }));
    }
  }

  /* ----- Publier un don ou une demande ----- */
  function ecranAnnonce() {
    const b = brouillon;
    const don = b.sens === 'don';
    const exemples = { l: 'Trois romans italiens', v: 'Manteau d’hiver, taille M', o: 'Une perceuse pour un week-end' };
    $app.innerHTML = `
      <h1>${esc(L(don ? 'Je donne' : 'Je cherche'))}</h1>
      <p class="sous">${esc(cercle.nom || L('Ton cercle'))}</p>
      <div class="bloc">
        <div class="rangee">
          <button type="button" class="choix" data-sens="don" aria-pressed="${don}">${esc(L('Je donne'))}</button>
          <button type="button" class="choix" data-sens="demande" aria-pressed="${!don}">${esc(L('Je cherche'))}</button>
        </div>
        <label>${esc(L('Sorte'))}</label>
        <div class="rangee">${CATEGORIES.map(([k, t]) =>
          `<button type="button" class="choix" data-cat="${k}" aria-pressed="${b.categorie === k}">${esc(L(t))}</button>`).join('')}</div>
        <label for="titre">${esc(L(don ? 'Ce que tu donnes' : 'Ce que tu cherches'))}</label>
        <input type="text" id="titre" maxlength="${MAX_TITRE}" value="${esc(b.titre)}" placeholder="${esc(L(exemples[b.categorie]))}">
        <label for="mot">${esc(L('Une précision (facultatif)'))}</label>
        <textarea id="mot" maxlength="${MAX_MOT}" placeholder="${esc(L('État, taille, pour qui, jusqu’à quand…'))}">${esc(b.mot)}</textarea>
        <p class="compte" id="compteMot"></p>
        <div class="rgpd">${esc(Lf('Visible par tout le cercle. Effacée quand tu la clos, ou d’elle-même au bout de {0} jours.', donnees?.duree || 90))}</div>
        <button class="btn${don ? ' terre' : ''}" id="publier">${esc(L('Publier'))}</button>
        <button class="btn calme" id="annuler">${esc(L('Annuler'))}</button>
      </div>`;

    const garder = () => { b.titre = $('titre').value; b.mot = $('mot').value; };
    const compter = () => { $('compteMot').textContent = Lf('{0} caractères restants.', MAX_MOT - $('mot').value.length); };
    compter();
    $('mot').oninput = compter;
    $app.querySelectorAll('[data-sens]').forEach((x) => { x.onclick = () => { garder(); b.sens = x.dataset.sens; afficher(); }; });
    $app.querySelectorAll('[data-cat]').forEach((x) => { x.onclick = () => { garder(); b.categorie = x.dataset.cat; afficher(); }; });
    $('annuler').onclick = () => { brouillon = null; ecran = 'cercle'; afficher(); };
    $('publier').onclick = async (e) => {
      garder();
      if (!b.titre.trim()) return dire(L('Il manque quelques mots pour dire ce que c’est.'));
      e.target.disabled = true;
      try {
        const r = await api('publier', { sens: b.sens, categorie: b.categorie, titre: b.titre, mot: b.mot, prenom });
        miennes[r.id] = r.jeton; ecrire('miennes', miennes);
        brouillon = null; ecran = 'cercle'; filtre = 'tout';
        dire(L('Publié.'));
        await rafraichir(); window.scrollTo(0, 0);
      } catch (err) {
        dire(err.message); e.target.disabled = false;
      }
    };
  }

  /* ----- Réglages ----- */
  function ecranReglages() {
    const duree = donnees?.duree || 90;
    $app.innerHTML = `
      <div class="entete">
        <div><h1>${esc(L('Réglages'))}</h1><p class="sous">${esc(cercle.nom || L('Ton cercle'))}</p></div>
        <a href="#" id="retour">${esc(L('Retour au cercle'))}</a>
      </div>

      <div class="bloc">
        <label for="prenom">${esc(L('Ton prénom'))}</label>
        <input type="text" id="prenom" maxlength="${MAX_PRENOM}" value="${esc(prenom)}" autocomplete="given-name">
        <p class="compte">${esc(L('Le prénom suffit.'))}</p>
        <button class="btn calme" id="garderPrenom">${esc(L('Enregistrer'))}</button>
      </div>

      <div class="bloc">
        <h2>${esc(L('Inviter'))}</h2>
        <p>${esc(LN('Envoie ce lien à tes proches. Qui l’a peut voir et publier dans le cercle : ne le mets pas en ligne.'))}</p>
        <div class="cle">${esc(lienCercle())}</div>
        <button class="btn" id="envoyerLien">${esc(L('Envoyer le lien'))}</button>
        <button class="btn calme" id="copierLien">${esc(L('Copier le lien'))}</button>
      </div>

      <div class="bloc">
        <h2>${esc(L('Ce que Grazie garde'))}</h2>
        <p><strong>${esc(L('Sur ce téléphone'))}</strong>${DP} ${esc(L('le code du cercle, ton prénom, et les jetons qui prouvent que tes annonces et tes réponses sont les tiennes.'))}</p>
        <p><strong>${esc(L('Sur le serveur (alwaysdata, en France)'))}</strong>${DP} ${esc(LN('le nom du cercle et, pour chaque annonce : ce qu’elle dit, un prénom, sa date, et le prénom de qui a répondu. Rien d’autre : ni téléphone, ni adresse, ni photo.'))}</p>
        <p><strong>${esc(L('Combien de temps'))}</strong>${DP} ${esc(LN(Lf('une annonce close est effacée tout de suite ; une annonce oubliée s’efface d’elle-même au bout de {0} jours.', duree)))}</p>
      </div>

      <div class="bloc">
        <h2>${esc(L('Gestion du cercle'))}</h2>
        ${cercle.admin ? `
          <p>${esc(L('Tu gères ce cercle sur cet appareil.'))}</p>
          <label for="nomCercle">${esc(L('Nom du cercle'))}</label>
          <input type="text" id="nomCercle" maxlength="40" value="${esc(cercle.nom)}">
          <button class="btn calme" id="renommer">${esc(L('Renommer'))}</button>
          <details><summary>${esc(L('Ta clé de gestion'))}</summary><div class="cle">${esc(cercle.admin)}</div></details>
          <details><summary>${esc(L('Créer un cercle'))}</summary>
            <label for="nomNouveau">${esc(L('Nom du cercle'))}</label>
            <input type="text" id="nomNouveau" maxlength="40" placeholder="${esc(L('La famille, les voisins…'))}">
            <button class="btn calme" id="creerAutre">${esc(L('Créer un cercle'))}</button>
          </details>` : `
          <details><summary>${esc(L('Je gère ce cercle'))}</summary>
            <label for="cleSaisie">${esc(L('Ta clé de gestion, si tu l’as.'))}</label>
            <input type="text" id="cleSaisie" autocomplete="off">
            <button class="btn calme" id="utiliserCle">${esc(L('Utiliser cette clé'))}</button>
          </details>`}
      </div>

      <div class="bloc">
        <h2>${esc(L('Tout effacer de ce téléphone'))}</h2>
        <p class="compte" style="margin-top:0">${esc(L('Clôt tes annonces, retire tes réponses, puis efface tout ce que Grazie garde ici. Pour revenir, il te faudra le lien du cercle.'))}</p>
        <button class="btn calme" id="effacer">${esc(L('Tout effacer de ce téléphone'))}</button>
      </div>
      ${pied()}`;

    $('retour').onclick = (e) => { e.preventDefault(); ecran = 'cercle'; afficher(); window.scrollTo(0, 0); };
    $('garderPrenom').onclick = () => {
      const p = $('prenom').value.trim().slice(0, MAX_PRENOM);
      if (!p) return;
      prenom = p; ecrire('prenom', prenom);
      dire(L('Prénom enregistré. Il s’applique à tes prochaines annonces et réponses.'));
    };
    $('envoyerLien').onclick = () => partager(lienCercle());
    $('copierLien').onclick = () => copier(lienCercle());
    if (cercle.admin) {
      $('renommer').onclick = (e) => agir(e.target, async () => {
        await api('renommer', { nom: $('nomCercle').value, admin: cercle.admin });
        dire(L('C’est noté.'));
      });
      $('creerAutre').onclick = async (e) => {
        e.target.disabled = true;
        try {
          const nom = $('nomNouveau').value.trim();
          const r = await api('creer_cercle', { nom, cle_existante: cercle.admin });
          cercle = { c: r.c, admin: r.admin, nom };
          miennes = {}; reponses = {};
          ecrire('cercle', cercle); ecrire('miennes', miennes); ecrire('reponses', reponses);
          ecran = 'cle'; afficher(); window.scrollTo(0, 0);
        } catch (err) { dire(err.message); e.target.disabled = false; }
      };
    } else {
      $('utiliserCle').onclick = async (e) => {
        const cle = $('cleSaisie').value.trim();
        if (!cle) return;
        e.target.disabled = true;
        try {
          const r = await api('liste', null, { admin: cle });
          if (!r.admin) { dire(L('Cette clé ne correspond pas à ce cercle.')); e.target.disabled = false; return; }
          cercle.admin = cle; ecrire('cercle', cercle);
          dire(L('Clé reconnue.'));
          afficher();
        } catch (err) { dire(err.message); e.target.disabled = false; }
      };
    }
    $('effacer').onclick = async (e) => {
      if (!confirm(LN('Tout effacer ? Tes annonces seront closes et tes réponses retirées.'))) return;
      e.target.disabled = true;
      for (const [id, jeton] of Object.entries(miennes)) await api('clore', { id, jeton }).catch(() => {});
      for (const [id, jeton] of Object.entries(reponses)) await api('liberer', { id, jeton }).catch(() => {});
      ['cercle', 'prenom', 'miennes', 'reponses'].forEach(oublier);
      cercle = null; prenom = ''; miennes = {}; reponses = {}; donnees = null; ecran = 'cercle';
      dire(L('C’est effacé.'));
      afficher(); window.scrollTo(0, 0);
    };
  }

  /* ================= Démarrage ================= */
  function demarrer() {
    const c = lireLien(location.hash);
    if (c) {
      history.replaceState(null, '', location.pathname);
      rejoindre(c);
    }
    rafraichir();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && cercle && prenom && ecran === 'cercle') rafraichir();
  });

  demarrer();
})();
</script>
</body>
</html>
